<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Setup Required</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Forces the web page to act like a native full-screen app */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents bouncing and scrolling on iPadOS */
            background-color: #f4f5f7; /* Neutral light-gray background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            -webkit-user-select: none; /* Prevents text selection overlay */
            user-select: none;
        }

        .container {
            padding: 20px;
            max-width: 90%;
        }

        h1 {
            font-size: 3rem;
            color: #1e293b; /* Dark slate */
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-size: 1.5rem;
            color: #64748b; /* Muted gray */
            margin: 0;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Setup Required</h1>
        <p>Please contact IT Support</p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Offline service worker active!', reg))
                    .catch(err => console.error('Service worker failed:', err));
            });
        }
    </script>
    
</body>
</html>
